<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الامتحانات | نظام إدارة الحلقات والمعهد الشرعي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <div class="logo js-institute-name">نظام إدارة الحلقات والمعهد الشرعي</div>
        <nav>
          <a href="dashboard.html">لوحة التحكم</a>
          <a href="students.html">الطلاب</a>
          <a href="programs.html">البرامج</a>
          <a href="attendance.html">الحضور</a>
          <a href="exams.html">الامتحانات</a>
          <a href="reports.html">التقارير</a>
          <a href="settings.html">الإعدادات</a>
          <a href="backup.html">النسخ الاحتياطي</a>
        </nav>
      </aside>
      <div class="main">
        <div class="topbar">
          <div class="brand">
            <img class="js-institute-logo" alt="الشعار" />
            <span>إدارة الامتحانات</span>
          </div>
          <div class="actions">
            <button class="btn btn-outline" data-action="logout">تسجيل الخروج</button>
          </div>
        </div>
        <div class="content">
          <div class="card">
            <h3>إضافة / تعديل امتحان</h3>
            <form id="examForm" class="form-grid">
              <input type="hidden" id="examId" />
              <div>
                <label for="examName">اسم الامتحان *</label>
                <input id="examName" type="text" required />
              </div>
              <div>
                <label for="examProgram">البرنامج</label>
                <select id="examProgram"></select>
              </div>
              <div>
                <label for="examDate">التاريخ *</label>
                <input id="examDate" type="date" required />
              </div>
              <div>
                <label for="examMaxScore">الدرجة الكلية *</label>
                <input id="examMaxScore" type="number" min="1" value="100" required />
              </div>
              <div style="align-self:end;">
                <button class="btn btn-primary" type="submit">حفظ الامتحان</button>
              </div>
            </form>
          </div>

          <div class="card">
            <h3>إدخال الدرجات</h3>
            <div class="form-grid">
              <div>
                <label for="gradeExamSelect">اختر الامتحان</label>
                <select id="gradeExamSelect"></select>
              </div>
              <div style="align-self:end;">
                <button class="btn btn-success" id="saveGrades">حفظ الدرجات</button>
              </div>
            </div>
            <div style="overflow:auto; margin-top:16px;">
              <table class="table" id="gradesTable">
                <thead>
                  <tr>
                    <th>الاسم</th>
                    <th>المستوى</th>
                    <th>الدرجة</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <h3>قائمة الامتحانات</h3>
            <div style="overflow:auto;">
              <table class="table" id="examsTable">
                <thead>
                  <tr>
                    <th>الاسم</th>
                    <th>البرنامج</th>
                    <th>التاريخ</th>
                    <th>الدرجة الكلية</th>
                    <th>الإجراءات</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/exams.js"></script>
  </body>
</html>
