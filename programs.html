<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة البرامج | نظام إدارة الحلقات والمعهد الشرعي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <div class="logo js-institute-name">نظام إدارة الحلقات والمعهد الشرعي</div>
        <nav>
          <a href="dashboard.html">لوحة التحكم</a>
          <a href="students.html">الطلاب</a>
          <a href="programs.html">البرامج</a>
          <a href="attendance.html">الحضور</a>
          <a href="exams.html">الامتحانات</a>
          <a href="reports.html">التقارير</a>
          <a href="settings.html">الإعدادات</a>
          <a href="backup.html">النسخ الاحتياطي</a>
        </nav>
      </aside>
      <div class="main">
        <div class="topbar">
          <div class="brand">
            <img class="js-institute-logo" alt="الشعار" />
            <span>إدارة البرامج</span>
          </div>
          <div class="actions">
            <button class="btn btn-outline" data-action="logout">تسجيل الخروج</button>
          </div>
        </div>
        <div class="content">
          <div class="card">
            <h3>إضافة / تعديل برنامج</h3>
            <form id="programForm" class="form-grid">
              <input type="hidden" id="programId" />
              <div>
                <label for="programName">اسم البرنامج *</label>
                <input id="programName" type="text" required />
              </div>
              <div>
                <label for="programType">نوع البرنامج</label>
                <select id="programType">
                  <option value="حلقة قرآن">حلقة قرآن</option>
                  <option value="دورة شرعية للكبار">دورة شرعية للكبار</option>
                </select>
              </div>
              <div>
                <label for="programTeacher">المعلم *</label>
                <input id="programTeacher" type="text" required />
              </div>
              <div>
                <label for="programSchedule">الجدول *</label>
                <input id="programSchedule" type="text" placeholder="الأحد والخميس | 5:00 م" required />
              </div>
              <div style="align-self:end;">
                <button class="btn btn-primary" type="submit">حفظ البرنامج</button>
              </div>
            </form>
          </div>

          <div class="card">
            <h3>إلحاق الطلاب بالبرنامج</h3>
            <div class="form-grid">
              <div>
                <label for="enrollProgramSelect">اختر البرنامج</label>
                <select id="enrollProgramSelect"></select>
              </div>
              <div style="align-self:end;">
                <button class="btn btn-success" id="saveEnrollments">حفظ الإلحاقات</button>
              </div>
            </div>
            <div id="studentsCheckboxes" style="display:grid; gap:8px; margin-top:16px;"></div>
          </div>

          <div class="card">
            <h3>قائمة البرامج</h3>
            <div style="overflow:auto;">
              <table class="table" id="programsTable">
                <thead>
                  <tr>
                    <th>الاسم</th>
                    <th>النوع</th>
                    <th>المعلم</th>
                    <th>الجدول</th>
                    <th>الإجراءات</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/programs.js"></script>
  </body>
</html>
