<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تسجيل حضور المعلم</title><link rel="stylesheet" href="css/style.css"></head><body class="login-page"><main class="auth-card"><h2>بوابة QR للمعلم</h2><p id="qrMsg">جاري التحقق...</p><div id="qrActions"></div></main><script type="module">import {db} from './js/db.js';import {toast} from './js/app.js';
await db.init();const p=new URLSearchParams(location.search);const t=p.get('token');const teacherId=p.get('teacher');const msg=document.getElementById('qrMsg');const actions=document.getElementById('qrActions');if(!t||!teacherId){msg.textContent='رابط غير صالح';}else{const today=new Date().toISOString().slice(0,10);const expected=btoa(`${teacherId}:${today}`);if(t!==expected){msg.textContent='انتهت صلاحية الرمز';}else{msg.textContent='اختر العملية';actions.innerHTML=`<button class="btn primary" id="in">دخول</button> <button class="btn" id="out">خروج</button>`;['in','out'].forEach(id=>document.getElementById(id).onclick=async()=>{await db.insert('qrLogs',{teacherId:+teacherId,type:id==='in'?'دخول':'خروج',at:new Date().toISOString()});toast('تم التسجيل');msg.textContent='تم حفظ العملية';actions.innerHTML='';});}}</script></body></html>
