<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الحضور والغياب | نظام إدارة الحلقات والمعهد الشرعي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <div class="logo js-institute-name">نظام إدارة الحلقات والمعهد الشرعي</div>
        <nav>
          <a href="dashboard.html">لوحة التحكم</a>
          <a href="students.html">الطلاب</a>
          <a href="programs.html">البرامج</a>
          <a href="attendance.html">الحضور</a>
          <a href="exams.html">الامتحانات</a>
          <a href="reports.html">التقارير</a>
          <a href="settings.html">الإعدادات</a>
          <a href="backup.html">النسخ الاحتياطي</a>
        </nav>
      </aside>
      <div class="main">
        <div class="topbar">
          <div class="brand">
            <img class="js-institute-logo" alt="الشعار" />
            <span>تسجيل الحضور</span>
          </div>
          <div class="actions">
            <button class="btn btn-outline" data-action="logout">تسجيل الخروج</button>
          </div>
        </div>
        <div class="content">
          <div class="card">
            <h3>اختيار البرنامج والتاريخ</h3>
            <div class="form-grid">
              <div>
                <label for="attendanceProgram">البرنامج</label>
                <select id="attendanceProgram"></select>
              </div>
              <div>
                <label for="attendanceDate">التاريخ</label>
                <input id="attendanceDate" type="date" />
              </div>
              <div style="align-self:end;">
                <button class="btn btn-primary" id="saveAttendance">حفظ الحضور</button>
              </div>
            </div>
          </div>
          <div class="card">
            <h3>سجل الطلاب</h3>
            <div style="overflow:auto;">
              <table class="table" id="attendanceTable">
                <thead>
                  <tr>
                    <th>الاسم</th>
                    <th>المستوى</th>
                    <th>الحالة</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <p class="note">سيتم إنشاء إنذارات تلقائية عند تكرار الغياب حسب الإعدادات (3، 5، 7).</p>
          </div>
        </div>
      </div>
    </div>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/attendance.js"></script>
  </body>
</html>
